<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Encryption & Decryption Tool (C++ WebAssembly Engine)</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Message Encryption Tool</h2>
<p class="subtitle">Vigenère Polyalphabetic Cipher powered by C++ Engine</p>
<div id="engine-badge" class="badge">Engine: C++ Logic Engine (cipher.cpp)</div>

<textarea id="message" placeholder="Enter message to encrypt"></textarea>

<input type="text" id="key" placeholder="Enter secret key (e.g. KEY)">

<div class="buttons">
<button onclick="encrypt()">Encrypt</button>
<button onclick="decrypt()">Decrypt</button>
</div>

<h3>Encrypted Message</h3>
<p id="encrypted"></p>

<h3>Decrypted Message</h3>
<p id="decrypted"></p>

</div>

<script src="script.js"></script>

</body>
</html>
